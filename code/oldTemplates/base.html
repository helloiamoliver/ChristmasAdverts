<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas Advert Reviews 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(180deg, #0a3d2e 0%, #1a5c47 50%, #0f4436 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        .mountains-of-christmas-regular {
  font-family: "Mountains of Christmas", serif;
  font-weight: 400;
  font-style: normal;
}

.mountains-of-christmas-bold {
  font-family: "Mountains of Christmas", serif;
  font-weight: 700;
  font-style: normal;
}
.star {
    font-size: 1.75rem;
    color: #d1d5db; /* gray-300 */
    cursor: pointer;
    transition: color 0.2s ease;
}

.star.active {
    color: #f59e0b; /* amber-500 */
}
        .tree-pattern {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            opacity: 0.15;
            pointer-events: none;
            background-image: 
                repeating-linear-gradient(90deg, transparent, transparent 100px, #1a5c47 100px, #1a5c47 102px),
                repeating-linear-gradient(0deg, transparent, transparent 150px, #1a5c47 150px, #1a5c47 152px);
        }
        
        .trees {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 300px;
            pointer-events: none;
            z-index: 0;
        }
        
        .tree {
            position: absolute;
            bottom: 0;
            width: 0;
            height: 0;
            border-left: 30px solid transparent;
            border-right: 30px solid transparent;
            border-bottom: 100px solid rgba(10, 50, 30, 0.6);
        }
        
        .tree::before {
            content: '';
            position: absolute;
            bottom: -120px;
            left: -25px;
            width: 0;
            height: 0;
            border-left: 25px solid transparent;
            border-right: 25px solid transparent;
            border-bottom: 80px solid rgba(15, 60, 40, 0.5);
        }
        
        .tree::after {
            content: '';
            position: absolute;
            bottom: -130px;
            left: -15px;
            width: 10px;
            height: 30px;
            background: rgba(80, 50, 30, 0.6);
        }
        
        .star-rating {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            margin: 1.5rem 0;
        }
        
        .star {
            font-size: 2.5rem;
            cursor: pointer;
            color: #d1d5db;
            transition: all 0.2s;
        }
        
        .star:hover,
        .star.active {
            color: #fbbf24;
            transform: scale(1.1);
        }
        
        .snowflake {
            position: fixed;
            top: -10px;
            color: white;
            font-size: 1.5rem;
            opacity: 0.8;
            animation: fall linear infinite;
            pointer-events: none;
            z-index: 1000;
        }
        
        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
            }
        }
        
        .gold-shine {
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 25%, #ffd700 50%, #ffed4e 75%, #ffd700 100%);
            background-size: 200% 200%;
            animation: shine 3s ease infinite;
        }
        
        @keyframes shine {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
    </style>
</head>
<body>
    <div class="tree-pattern"></div>
    <div class="trees">
        <div class="tree" style="left: 5%; height: 120px;"></div>
        <div class="tree" style="left: 15%; height: 150px;"></div>
        <div class="tree" style="left: 25%; height: 100px;"></div>
        <div class="tree" style="left: 38%; height: 130px;"></div>
        <div class="tree" style="left: 52%; height: 110px;"></div>
        <div class="tree" style="left: 65%; height: 140px;"></div>
        <div class="tree" style="left: 78%; height: 95px;"></div>
        <div class="tree" style="right: 5%; height: 125px;"></div>
    </div>
    
    <div class="relative z-10">
        {% block content %}{% endblock %}
    </div>
    
    {% block scripts %}{% endblock %}
</body>
</html>
