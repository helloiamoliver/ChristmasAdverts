<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas Advert Reviews 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Mountains+of+Christmas:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --spruce: #123b2d;
            --spruce-deep: #0c2a20;
            --berry: #a3202f;
            --berry-dark: #801823;
            --gold: #d9a93a;
            --paper: #fbf8f1;
            --ink: #1f2d26;
            --muted: #5d6a62;
            --line: #ddd3bd;
        }

        [hidden] { display: none !important; }

        body {
            font-family: "Atkinson Hyperlegible", system-ui, sans-serif;
            color: var(--ink);
            min-height: 100vh;
            background-color: var(--spruce);
            /* faint snowfall speckle */
            background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='90' height='90'><circle cx='14' cy='18' r='1.5' fill='white' fill-opacity='.08'/><circle cx='58' cy='52' r='2' fill='white' fill-opacity='.06'/><circle cx='78' cy='12' r='1' fill='white' fill-opacity='.08'/><circle cx='30' cy='74' r='1.2' fill='white' fill-opacity='.07'/></svg>");
        }

        .display {
            font-family: "Mountains of Christmas", Georgia, serif;
            font-weight: 700;
            letter-spacing: 0.01em;
        }

        /* String of fairy lights along the top of every page */
        .lights {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 52px;
            pointer-events: none;
            background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='360' height='52' viewBox='0 0 360 52'><path d='M0 4 Q45 30 90 4 Q135 30 180 4 Q225 30 270 4 Q315 30 360 4' fill='none' stroke='%23071a13' stroke-width='2'/><g fill='%23071a13'><rect x='43' y='16' width='4' height='6'/><rect x='133' y='16' width='4' height='6'/><rect x='223' y='16' width='4' height='6'/><rect x='313' y='16' width='4' height='6'/></g><ellipse cx='45' cy='29' rx='5' ry='7' fill='%23e03a50'/><ellipse cx='135' cy='29' rx='5' ry='7' fill='%23f2bd45'/><ellipse cx='225' cy='29' rx='5' ry='7' fill='%23f6f0e0'/><ellipse cx='315' cy='29' rx='5' ry='7' fill='%2350b886'/></svg>");
            background-repeat: repeat-x;
            background-position: top center;
        }

        /* The paper card everything sits on */
        .card {
            background: var(--paper);
            border-radius: 6px;
            border-top: 6px solid var(--berry);
            box-shadow: 0 14px 34px rgba(0, 0, 0, 0.28);
        }

        .rule { border: 0; border-top: 1px dashed var(--line); }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.05rem;
            padding: 0.8rem 1.6rem;
            border-radius: 6px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: background-color 0.15s, color 0.15s, border-color 0.15s;
        }
        .btn:focus-visible, .field:focus-visible, .bauble input:focus-visible + span {
            outline: 3px solid var(--gold);
            outline-offset: 2px;
        }
        .btn-primary { background: var(--spruce); color: #fff; }
        .btn-primary:hover { background: var(--spruce-deep); }
        .btn-berry { background: var(--berry); color: #fff; }
        .btn-berry:hover { background: var(--berry-dark); }
        .btn-ghost { background: transparent; color: var(--muted); border-color: var(--line); }
        .btn-ghost:hover { color: var(--ink); border-color: var(--muted); }
        .btn:disabled { background: #e6e0d0; color: #8c8a80; cursor: not-allowed; }

        /* Text inputs */
        .field {
            width: 100%;
            padding: 0.7rem 0.9rem;
            font: inherit;
            color: var(--ink);
            background: #fff;
            border: 2px solid var(--line);
            border-radius: 6px;
        }
        .field:focus { outline: none; border-color: var(--berry); }

        /* Ratings: ten numbered baubles (real radio buttons underneath) */
        .rating-row {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 0.9rem 0.5rem;
            justify-items: center;
            padding-top: 6px;
        }
        @media (min-width: 560px) {
            .rating-row { grid-template-columns: repeat(10, minmax(0, 1fr)); }
        }
        .bauble { cursor: pointer; }
        .bauble input {
            position: absolute;
            opacity: 0;
            width: 1px; height: 1px;
        }
        .bauble span {
            position: relative;
            display: grid;
            place-items: center;
            width: 2.6rem; height: 2.6rem;
            border-radius: 50%;
            border: 2px solid var(--line);
            background: #fff;
            font-weight: 700;
            color: var(--muted);
            transition: background-color 0.15s, color 0.15s, border-color 0.15s;
        }
        /* the little gold cap on top */
        .bauble span::before {
            content: "";
            position: absolute;
            top: -7px; left: 50%;
            width: 10px; height: 6px;
            margin-left: -5px;
            border-radius: 2px 2px 0 0;
            background: var(--gold);
        }
        .bauble:hover span { border-color: var(--berry); color: var(--berry); }
        .bauble input:checked + span {
            background: var(--berry);
            border-color: var(--berry);
            color: #fff;
        }

        .sr-only {
            position: absolute;
            width: 1px; height: 1px;
            padding: 0; margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }

        @media print {
            body { background: #fff; }
            .lights, .no-print { display: none !important; }
            .card { box-shadow: none; border: 1px solid var(--line); border-top: 6px solid var(--berry); break-inside: avoid; }
        }
    </style>
</head>
<body>
    <div class="lights" aria-hidden="true"></div>

    <div class="relative">
        {% block content %}{% endblock %}
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
